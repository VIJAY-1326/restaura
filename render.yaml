services:
  - type: web
    name: restaura-service
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_HOST
        fromDatabase:
          name: restaura-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: restaura-mysql
          property: port
      - key: DB_USER
        fromDatabase:
          name: restaura-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: restaura-mysql
          property: password
      - key: DB_NAME
        fromDatabase:
          name: restaura-mysql
          property: database

databases:
  - name: restaura-mysql
    plan: free
    databaseName: restaurant_db
    user: restaura_user
