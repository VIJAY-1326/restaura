services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    restart: always
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root_password_here
      DB_NAME: restaurant_db
      JWT_SECRET: restaura_production_jwt_secret_2026
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    depends_on:
      - db

volumes:
  db_data:
